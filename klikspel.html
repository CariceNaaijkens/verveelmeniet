<!doctype html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Klikspel - VerveelMeNiet!</title><link rel="icon" href="icoon.svg" type="image/svg+xml"><link rel="stylesheet" href="style.css"></head><body><main class="page"><section class="card"><h1>🎯 Klikspel</h1><p>Tijd: <b id="time">10</b> sec. | Score: <b id="score">0</b></p><button class="big" id="click" disabled>KLIK!</button><p><button onclick="start()">▶️ Start</button></p><p id="msg"></p><a class="back" href="spelletjes.html">🎮 Spelletjes</a></section></main><script>let s=0,t=10,timer,playing=false;const $=id=>document.getElementById(id);function start(){clearInterval(timer);s=0;t=10;playing=true;$('score').textContent=s;$('time').textContent=t;$('msg').textContent='Go!';$('click').disabled=false;timer=setInterval(()=>{t--;$('time').textContent=t;if(t<=0){clearInterval(timer);playing=false;$('click').disabled=true;$('msg').textContent='Klaar! Je score is '+s+'.';localStorage.setItem('klikHighscore',Math.max(s,+localStorage.getItem('klikHighscore')||0));localStorage.setItem('points',(+localStorage.getItem('points')||0)+s)}},1000)}$('click').onclick=()=>{if(playing)$('score').textContent=++s}</script></body></html>
