<!doctype html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>2048-achtig - VerveelMeNiet!</title><link rel="icon" href="icoon.svg" type="image/svg+xml"><link rel="stylesheet" href="style.css"></head><body><main class="page"><section class="card"><h1>🔢 2048-achtig</h1><p>Gebruik de pijltjestoetsen om tegels te schuiven.</p><div id="grid2048"></div><button onclick="newGame()">🔄 Opnieuw</button><a class="back" href="spelletjes.html">🎮 Spelletjes</a></section></main><script>let a=[];function newGame(){a=Array(16).fill(0);add();add();render()}function add(){let z=a.map((v,i)=>v?null:i).filter(v=>v!==null);if(z.length)a[z[Math.random()*z.length|0]]=2}function render(){let g=document.getElementById('grid2048');g.innerHTML='';a.forEach(v=>{let d=document.createElement('div');d.textContent=v||'';g.appendChild(d)})}function move(dir){let lines=[];for(let i=0;i<4;i++)lines.push(dir==='left'||dir==='right'?a.slice(i*4,i*4+4):[a[i],a[i+4],a[i+8],a[i+12]]);lines=lines.map(r=>{if(dir==='right'||dir==='down')r.reverse();r=r.filter(Boolean);for(let i=0;i<r.length-1;i++)if(r[i]===r[i+1]){r[i]*=2;r.splice(i+1,1)}while(r.length<4)r.push(0);if(dir==='right'||dir==='down')r.reverse();return r});a=Array(16).fill(0);lines.forEach((r,i)=>r.forEach((v,j)=>{if(dir==='left'||dir==='right')a[i*4+j]=v;else a[j*4+i]=v}));add();render()}document.addEventListener('keydown',e=>{let d={'ArrowLeft':'left','ArrowRight':'right','ArrowUp':'up','ArrowDown':'down'}[e.key];if(d){e.preventDefault();move(d)}});newGame()</script></body></html>
