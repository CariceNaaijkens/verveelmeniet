<!doctype html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Steen-papier-schaar - VerveelMeNiet!</title><link rel="icon" href="icoon.svg" type="image/svg+xml"><link rel="stylesheet" href="style.css"></head><body><main class="page"><section class="card"><h1>🪨📄✂️ Steen-papier-schaar</h1><div class="grid small"><button onclick="play('steen')">🪨 Steen</button><button onclick="play('papier')">📄 Papier</button><button onclick="play('schaar')">✂️ Schaar</button></div><p id="result"></p><a class="back" href="spelletjes.html">🎮 Spelletjes</a></section></main><script>function play(me){let all=['steen','papier','schaar'],cpu=all[Math.random()*3|0],win=me===cpu?'Gelijkspel!':((me==='steen'&&cpu==='schaar')||(me==='papier'&&cpu==='steen')||(me==='schaar'&&cpu==='papier'))?'Jij wint! 🎉':'Computer wint! 🤖';document.getElementById('result').textContent='Jij: '+me+' | Computer: '+cpu+' — '+win}</script></body></html>
