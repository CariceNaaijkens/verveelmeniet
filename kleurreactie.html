<!doctype html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kleur-reactiespel - VerveelMeNiet!</title><link rel="icon" href="icoon.svg" type="image/svg+xml"><link rel="stylesheet" href="style.css"></head><body><main class="page"><section class="card"><h1>🟢 Kleur-reactiespel</h1><p>Klik op de kleur die onder Doel staat.</p><div id="box" class="color-box"></div><p>Doel: <b id="target"></b></p><p>Score: <b id="score">0</b> | Tijd: <b id="time">20</b></p><button onclick="start()">▶️ Start</button><p id="msg"></p><a class="back" href="spelletjes.html">🎮 Spelletjes</a></section></main><script>const colors=['red','blue','green','orange','purple'];let target,score=0,time=20,timer,playing=false;function next(){target=colors[Math.random()*colors.length|0];document.getElementById('target').textContent=target;document.getElementById('box').style.background=colors[Math.random()*colors.length|0]}function start(){clearInterval(timer);score=0;time=20;playing=true;document.getElementById('score').textContent=score;document.getElementById('time').textContent=time;document.getElementById('msg').textContent='';next();timer=setInterval(()=>{time--;document.getElementById('time').textContent=time;if(time<=0){playing=false;clearInterval(timer);document.getElementById('msg').textContent='Klaar! Score: '+score}},1000)}document.getElementById('box').onclick=()=>{if(!playing)return;let box=document.getElementById('box');if(box.style.backgroundColor===target){score++;document.getElementById('score').textContent=score;next()}else document.getElementById('msg').textContent='Bijna! Probeer opnieuw.'};start()</script></body></html>
