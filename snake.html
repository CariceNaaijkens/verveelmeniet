<!doctype html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mini Snake - VerveelMeNiet!</title><link rel="icon" href="icoon.svg" type="image/svg+xml"><link rel="stylesheet" href="style.css"></head><body><main class="page"><section class="card"><h1>🐍 Mini Snake</h1><canvas id="game" width="360" height="360"></canvas><p>Gebruik de pijltjestoetsen. Score: <b id="score">0</b></p><button onclick="start()">▶️ Start / opnieuw</button><a class="back" href="spelletjes.html">🎮 Spelletjes</a></section></main><script>const c=document.getElementById('game'),ctx=c.getContext('2d'),N=20,S=18;let snake,food,dx,dy,loop,score;function start(){snake=[{x:10,y:10}];food={x:5,y:5};dx=1;dy=0;score=0;document.getElementById('score').textContent=0;clearInterval(loop);loop=setInterval(tick,120);draw()}document.addEventListener('keydown',e=>{if(e.key==='ArrowUp'&&dy!==1){dx=0;dy=-1}if(e.key==='ArrowDown'&&dy!==-1){dx=0;dy=1}if(e.key==='ArrowLeft'&&dx!==1){dx=-1;dy=0}if(e.key==='ArrowRight'&&dx!==-1){dx=1;dy=0}});function tick(){let h={x:snake[0].x+dx,y:snake[0].y+dy};if(h.x<0||h.y<0||h.x>=N||h.y>=N||snake.some(v=>v.x===h.x&&v.y===h.y)){clearInterval(loop);alert('Game over! Score: '+score);return}snake.unshift(h);if(h.x===food.x&&h.y===food.y){score++;document.getElementById('score').textContent=score;do{food={x:Math.floor(Math.random()*N),y:Math.floor(Math.random()*N)}}while(snake.some(v=>v.x===food.x&&v.y===food.y))}else snake.pop();draw()}function draw(){ctx.fillStyle='#222';ctx.fillRect(0,0,360,360);ctx.fillStyle='#4ade80';snake.forEach(v=>ctx.fillRect(v.x*S+1,v.y*S+1,S-2,S-2));ctx.fillStyle='#fb7185';ctx.fillRect(food.x*S+2,food.y*S+2,S-4,S-4)}start()</script></body></html>
