<!doctype html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Geheugenspel - VerveelMeNiet!</title><link rel="icon" href="icoon.svg" type="image/svg+xml"><link rel="stylesheet" href="style.css"></head><body><main class="page"><h1>🧠 Geheugenspel</h1><p>Vind alle paren!</p><div id="board" class="memory"></div><p id="msg"></p><button onclick="location.reload()">🔄 Opnieuw</button><a class="back" href="spelletjes.html">🎮 Spelletjes</a></main><script>const emojis=['🐸','🐱','🦆','🥔','🧀','🐉','🍕','🚀'];let cards=[...emojis,...emojis].sort(()=>Math.random()-.5),open=[],found=0;const board=document.getElementById('board');cards.forEach(e=>{let b=document.createElement('button');b.className='memory-card';b.textContent='❓';b.onclick=()=>{if(open.length===2||b.disabled)return;b.textContent=e;open.push({b,e});if(open.length===2)setTimeout(()=>{if(open[0].e===open[1].e){open.forEach(x=>{x.b.disabled=true;x.b.classList.add('found')});if(++found===emojis.length)document.getElementById('msg').textContent='🎉 Alles gevonden!'}else open.forEach(x=>x.b.textContent='❓');open=[]},500)};board.appendChild(b)})</script></body></html>
