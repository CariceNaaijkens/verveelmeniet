<!doctype html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mini-puzzel - VerveelMeNiet!</title><link rel="icon" href="icoon.svg" type="image/svg+xml"><link rel="stylesheet" href="style.css"></head><body><main class="page"><section class="card"><h1>🧩 Mini-puzzel</h1><p id="q"></p><div id="answers" class="grid small"></div><p id="msg"></p><button onclick="newQ()">🔄 Nieuwe puzzel</button><a class="back" href="spelletjes.html">🎮 Spelletjes</a></section></main><script>const qs=[['Wat is 7 + 5?',['10','12','14'],'12'],['Welke is een planeet?',['Maan','Mars','Zon'],'Mars'],['Hoeveel dagen heeft een week?',['5','7','9'],'7'],['Welke kleur krijg je met blauw + geel?',['Groen','Paars','Oranje'],'Groen']];function newQ(){let z=qs[Math.random()*qs.length|0];document.getElementById('q').textContent=z[0];document.getElementById('msg').textContent='';let a=document.getElementById('answers');a.innerHTML='';z[1].forEach(v=>{let b=document.createElement('button');b.textContent=v;b.onclick=()=>document.getElementById('msg').textContent=v===z[2]?'🎉 Goed!':'❌ Helaas, probeer opnieuw.';a.appendChild(b)})}newQ()</script></body></html>
